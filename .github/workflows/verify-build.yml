name: Verify Next.js build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify TSX syntax
        run: npm run syntax
      - name: Type-check project
        run: npm run lint
      - name: Validate routes and interactions
        run: |
          npm run audit
          npm run smoke
          npm run ui-audit
          npm run concierge:check
      - name: Build Next.js production output
        run: npm run build
